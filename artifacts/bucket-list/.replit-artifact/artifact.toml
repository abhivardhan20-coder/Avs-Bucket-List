kind = "web"
previewPath = "/"
title = "AV's Bucket List"
version = "1.0.0"
id = "artifacts/bucket-list"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21741

[services.development]
run = "pnpm --filter @workspace/bucket-list run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bucket-list", "run", "build" ]
publicDir = "artifacts/bucket-list/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21741"
BASE_PATH = "/"
